services:
  - type: web
    name: smart-lms-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --production
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ENABLE_NOTIFICATIONS
        value: false
